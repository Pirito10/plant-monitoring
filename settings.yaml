# ===========
# 📷 Cámara
# ===========

camera:
  # Resolución de la cámara en píxeles
  width: 2592
  height: 1944


# ==========
# 📁 Rutas
# ==========

paths:
  # Directorio donde se guardarán las fotos
  photos: photos


# ============================
# ⏱️ Planificación de tareas
# ============================

scheduler:
  # Horas del día (0-23) para tomar fotos
  photo_hours: [10, 18]
  # Intervalo (en segundos) para medir la humedad del suelo
  moisture_interval: 10
  # Frecuencia (en segundos) de actualización de la pantalla
  display_interval: 0.5

# ======================
# 💧 Sensor de humedad
# ======================

moisture:
  # Pin analógico al que está conectado el sensor de humedad
  pin: A0
  # Valor absoluto de humedad en seco
  raw_dry: 21550
  # Valor absoluto de humedad en mojado
  raw_wet: 7600


# ============
# 💡 LED RGB
# ============

led_rgb:
  # Pines GPIO a los que están conectados los canales del LED RGB
  pins:
    red: 17
    green: 27
    blue: 22
  # Valor de humedad (en porcentaje) considerado óptimo para el gradiente de color
  optimal_moisture: 50


# =============
# 🖥️ Pantalla
# =============

display:
  # Valor (en porcentaje) de humedad mínimo antes de la activación del indicador de humedad baja
  moisture_threshold: 30
  # Intervalo (en segundos) de parpadeo del indicador de humedad baja
  blink_interval: 1